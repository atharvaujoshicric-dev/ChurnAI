<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChurnAI — Predictive Customer Intelligence</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- Global -->
  <link rel="stylesheet" href="assets/css/global.css" />

  <!-- Module CSS (each module owns its own) -->
  <link rel="stylesheet" href="modules/auth/auth.css" />
  <link rel="stylesheet" href="modules/dashboard/dashboard.css" />
  <link rel="stylesheet" href="modules/prediction/prediction.css" />
  <link rel="stylesheet" href="modules/segmentation/segmentation.css" />
  <link rel="stylesheet" href="modules/retention/retention.css" />
  <link rel="stylesheet" href="modules/alerts/alerts.css" />
</head>
<body>

  <!-- ════════════════════════════════
       SIDEBAR
  ════════════════════════════════ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">◈</span>
      <span class="brand-name">ChurnAI</span>
    </div>

    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" data-page="dashboard">
        <span class="nav-icon">▦</span> Dashboard
      </a>
      <a href="#" class="nav-item" data-page="prediction">
        <span class="nav-icon">◎</span> Churn Prediction
      </a>
      <a href="#" class="nav-item" data-page="segmentation">
        <span class="nav-icon">◈</span> Segmentation
      </a>
      <a href="#" class="nav-item" data-page="retention">
        <span class="nav-icon">◉</span> Retention Engine
      </a>
      <a href="#" class="nav-item" data-page="alerts">
        <span class="nav-icon">🔔</span> Live Alerts
      </a>
    </nav>

    <div class="sidebar-industry">
      <div class="industry-label">Industry Mode</div>
      <select id="industrySelect" class="industry-select">
        <option value="telecom">📡 Telecom</option>
        <option value="saas">💻 SaaS</option>
        <option value="gym">🏋️ Gym / Fitness</option>
        <option value="subscription">📦 Subscription App</option>
      </select>
    </div>

    <div class="sidebar-status">
      <div class="status-dot"></div>
      <span>Model Active</span>
    </div>
  </aside>

  <!-- ════════════════════════════════
       MAIN
  ════════════════════════════════ -->
  <main class="main" id="main">

    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" id="menuBtn">☰</button>
        <h1 class="page-title" id="pageTitle">Analytics Dashboard</h1>
      </div>
      <div class="topbar-right">
        <!-- Role badge injected by auth module -->
        <div class="topbar-badge">
          <span class="badge-dot pulse"></span>Live Data
        </div>
        <div class="topbar-avatar">JD</div>
      </div>
    </header>

    <div class="pages">
      <!-- MODULE 1: DASHBOARD -->
      <section class="page active" id="page-dashboard"></section>
      <!-- MODULE 2: PREDICTION -->
      <section class="page" id="page-prediction"></section>
      <!-- MODULE 3: SEGMENTATION -->
      <section class="page" id="page-segmentation"></section>
      <!-- MODULE 4: RETENTION -->
      <section class="page" id="page-retention"></section>
      <!-- MODULE 6: ALERTS -->
      <section class="page" id="page-alerts"></section>
    </div>
  </main>

  <!-- ════════════════════════════════
       SCRIPTS
       Load order:
       1. core/data.js       — data layer
       2. core/charts.js     — chart factory
       3. modules/*          — each self-registers
       4. core/app.js        — router boots last
       5. modules/auth/      — auth overlays after app
  ════════════════════════════════ -->
  <script src="core/data.js"></script>
  <script src="core/charts.js"></script>
  <script src="modules/dashboard/dashboard.js"></script>
  <script src="modules/prediction/prediction.js"></script>
  <script src="modules/segmentation/segmentation.js"></script>
  <script src="modules/retention/retention.js"></script>
  <script src="modules/alerts/alerts.js"></script>
  <script src="core/app.js"></script>
  <script src="modules/auth/auth.js"></script>

</body>
</html>
